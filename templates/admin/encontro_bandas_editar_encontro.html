{% extends "layout/base_admin.html" %}

{% block title %}
Editar Encontro de Bandas
{% endblock %}

{% block content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="mb-1">
                ✏️ Editar Encontro
            </h2>

            <p class="text-muted mb-0">
                Atualize as informações do encontro.
            </p>

        </div>

        <a
            href="/admin/encontros-bandas/{{ encontro.id }}"
            class="btn btn-secondary"
        >
            ← Voltar
        </a>

    </div>


    {% if erro %}

    <div class="alert alert-danger">
        {{ erro }}
    </div>

    {% endif %}


    <div class="card card-bn">

        <div class="card-body">

            <form
                method="POST"
                action="/admin/encontros-bandas/{{ encontro.id }}/editar"
            >

                <!-- NOME -->

                <div class="mb-3">

                    <label class="form-label">
                        Nome do encontro
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        value="{{ encontro.nome }}"
                        required
                    >

                </div>


                <div class="row">

                    <!-- DATA -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input
                            type="date"
                            name="data"
                            class="form-control"
                            value="{{ encontro.data }}"
                            required
                        >

                    </div>


                    <!-- HORÁRIO -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Horário
                        </label>

                        <input
                            type="time"
                            name="horario"
                            class="form-control"
                            value="{{ encontro.horario }}"
                        >

                    </div>


                    <!-- STATUS -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option
                                value="PLANEJAMENTO"
                                {% if encontro.status == "PLANEJAMENTO" %}
                                selected
                                {% endif %}
                            >
                                PLANEJAMENTO
                            </option>

                            <option
                                value="CONFIRMADO"
                                {% if encontro.status == "CONFIRMADO" %}
                                selected
                                {% endif %}
                            >
                                CONFIRMADO
                            </option>

                            <option
                                value="REALIZADO"
                                {% if encontro.status == "REALIZADO" %}
                                selected
                                {% endif %}
                            >
                                REALIZADO
                            </option>

                            <option
                                value="CANCELADO"
                                {% if encontro.status == "CANCELADO" %}
                                selected
                                {% endif %}
                            >
                                CANCELADO
                            </option>

                        </select>

                    </div>

                </div>


                <!-- LOCAL -->

                <div class="mb-3">

                    <label class="form-label">
                        Local
                    </label>

                    <input
                        type="text"
                        name="local"
                        class="form-control"
                        value="{{ encontro.local or '' }}"
                    >

                </div>


                <!-- OBSERVAÇÕES -->

                <div class="mb-4">

                    <label class="form-label">
                        Observações
                    </label>

                    <textarea
                        name="observacoes"
                        class="form-control"
                        rows="4"
                    >{{ encontro.observacoes or '' }}</textarea>

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-warning"
                    >
                        💾 Salvar alterações
                    </button>

                    <a
                        href="/admin/encontros-bandas/{{ encontro.id }}"
                        class="btn btn-secondary"
                    >
                        Cancelar
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
