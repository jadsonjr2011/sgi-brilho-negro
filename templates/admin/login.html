{% extends 'layout/base.html' %}

{% block titulo %}
Login Administrativo
{% endblock %}

{% block conteudo %}

<div class="login-brilho">

    <div class="login-card">

        <h2 class="text-center">
            🔐 Área Administrativa
        </h2>

        <hr>

        {% if erro %}

        <div class="alert alert-danger">
            {{ erro }}
        </div>

        {% endif %}

        <form method="POST">

            <label>
                Usuário
            </label>

            <input
                class="form-control"
                name="usuario"
                required>

            <label class="mt-3">
                Senha
            </label>

            <input
                type="password"
                class="form-control"
                name="senha"
                required>

            <button
                type="submit"
                class="btn btn-brilho w-100 mt-4">

                Entrar

            </button>

            <div class="text-center mt-4">

                <a href="/cadastro"
                   class="btn btn-outline-warning">

                    📝 Fazer Cadastro

                </a>

                <a href="/"
                   class="btn btn-outline-secondary ms-2">

                    🏠 Voltar ao Início

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
