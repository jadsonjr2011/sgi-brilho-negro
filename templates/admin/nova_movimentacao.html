{% extends 'layout/base.html' %}


{% block titulo %}
Nova Movimentação
{% endblock %}



{% block conteudo %}


<div class="card-bn">


<div class="d-flex justify-content-between align-items-center mb-3">


    <h2 class="titulo">
        💰 Nova Movimentação
    </h2>


    <a href="/admin/financeiro"
       class="btn btn-secondary">

        ⬅ Voltar

    </a>


</div>


<hr>



<form method="POST">



<div class="row">



<div class="col-md-4">

<label class="form-label">
    📅 Temporada
</label>

<select
name="temporada"
class="form-select"
required>

<option value="2026">
2026
</option>

<option value="2027">
2027
</option>

<option value="2028">
2028
</option>

</select>    

<label class="form-label">
Tipo
</label>


<select
name="tipo"
class="form-select"
required>


<option value="">
Selecione
</option>


<option value="RECEITA">
⬆️ Receita
</option>


<option value="DESPESA">
⬇️ Despesa
</option>


</select>


</div>



<div class="col-md-4">


<label class="form-label">
Categoria
</label>


<input
type="text"
name="categoria"
class="form-control"
placeholder="Ex: Transporte, Uniforme, Evento">


</div>



<div class="col-md-4">


<label class="form-label">
Data
</label>


<input
type="date"
name="data_movimento"
class="form-control"
required>


</div>



</div>




<div class="mt-3">


<label class="form-label">
Descrição
</label>


<input
type="text"
name="descricao"
class="form-control"
placeholder="Descrição da movimentação"
required>


</div>




<div class="row mt-3">



<div class="col-md-4">


<label class="form-label">
Valor
</label>


<label class="form-label">
    Valor
</label>

<input
type="text"
name="valor"
id="valor"
class="form-control"
placeholder="0,00"
required>


</div>



<div class="col-md-8">


<label class="form-label">
Observação
</label>


<textarea
name="observacao"
class="form-control"
rows="3"
placeholder="Informações adicionais">

</textarea>


</div>



</div>




<div class="text-center mt-5">


<button
class="btn btn-success">

💾 Salvar Movimentação

</button>



<a href="/admin/financeiro"
class="btn btn-secondary ms-2">

Cancelar

</a>


</div>



</form>



</div>

<script>

document
.getElementById("valor")
.addEventListener("input", function(){

    let valor = this.value
        .replace(/\D/g,'');

    valor = (valor / 100)
        .toFixed(2)
        .replace(".", ",");

    this.value = valor;

});

</script>


{% endblock %}
